name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: 治理校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 校验宪法与规格产物
        run: python3 .github/scripts/check-governance.py

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 扫描仓库历史中的密钥
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      relationship: ${{ steps.filter.outputs.relationship }}
      message: ${{ steps.filter.outputs.message }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            identity:
              - 'services/identity/**'
            relationship:
              - 'services/relationship/**'
            message:
              - 'services/message/**'

  identity-coverage:
    name: identity 覆盖率门禁（Go ≥80%）
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 测试并生成覆盖率
        run: |
          go test -coverpkg=./api/grpc/...,./api/http/...,./application/...,./domain/...,./infrastructure/auth/...,./infrastructure/cache/...,./infrastructure/config/...,./infrastructure/persistence/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: 覆盖率门禁（≥80%）
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN { if (t < 80) { print "覆盖率未达 80%"; exit 1 } }'

  relationship-coverage:
    name: relationship 覆盖率门禁（Go ≥80%）
    needs: changes
    if: needs.changes.outputs.relationship == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/relationship
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 测试并生成覆盖率
        run: |
          go test -coverpkg=./api/grpc/...,./api/http/...,./application/...,./domain/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: 覆盖率门禁（≥80%）
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          awk -v t="$total" 'BEGIN { if (t < 80) { print "覆盖率未达 80%"; exit 1 } }'

  message-coverage:
    name: message 覆盖率门禁（Go ≥80%）
    needs: changes
    if: needs.changes.outputs.message == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/message
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: 测试并生成覆盖率
        run: |
          go test -coverpkg=./api/grpc/...,./api/http/...,./application/...,./domain/...,./infrastructure/cache/...,./infrastructure/grpcclient/...,./infrastructure/logging/...,./infrastructure/persistence/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: 覆盖率门禁（≥80%）
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 80) { print "覆盖率未达 80%，门禁失败"; exit 1 } }'

  # TODO(TECH_STACK): 以下门禁待补充——对应宪法 F 组（依赖方向与跨服务数据访问检查）、
  # E 组（SAST / SCA / 镜像扫描 / 契约破坏性变更检测）。覆盖率门禁已在 coverage job 落地。
